// Process-global configuration (src/lua_exports.cpp).
syntax = "proto3";

package vf.config;

option optimize_for = LITE_RUNTIME;

message Weights {
  optional double key_weight = 1;
  optional double same_finger_weight = 2;
  optional double same_key_weight = 3;
  optional double alt_hand_weight = 4;
  optional double good_roll_weight = 5;
  optional double bad_roll_weight = 6;
}

// `key`, `hand` and `finger` are indices into the Enums name lists.
message KeyInfo {
  int32 key = 1;
  int32 hand = 2;
  int32 finger = 3;
  double base_cost = 4;
}

message CountPenaltyOverride {
  oneof count_class {
    string class_name = 1;
    int32 class_index = 2;
  }
  optional double base = 3;
  optional double count_slope = 4;
  optional double span_slope = 5;
}

// Unset fields keep their current value. A non-empty count_penalty_overrides
// replaces the previous overrides and enables them unless
// use_count_penalty_overrides says otherwise.
message Config {
  optional int32 default_keyboard = 1;
  Weights weights = 2;
  repeated KeyInfo keys = 3;
  optional int32 slice_buffer_amount = 4;
  optional int32 shiftwidth = 5;
  optional bool use_count_penalty_overrides = 6;
  repeated CountPenaltyOverride count_penalty_overrides = 7;
}

// Enum value names in index order.
message Enums {
  repeated string keys = 1;
  repeated string fingers = 2;
  repeated string hands = 3;
  repeated string count_classes = 4;
}
