name: CI
on:
  pull_request:
  push:
    branches:
      - main

env:
  NEOVIM_VERSION: v0.11.5

jobs:
  dependency-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: sudo apt-get install -y ripgrep gawk
      - name: Lint module dependencies
        run: ./scripts/lint-module-deps.sh
      - name: Lint module inline rule
        run: ./scripts/lint-module-inline.sh

  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify doc-src frontmatter titles match H1 headings
        # `doc-src/*.md` feeds two consumers: Astro Starlight (reads
        # `title:` from frontmatter) and panvimdoc (reads the H1). Drift
        # between them silently produces different titles on the two
        # surfaces. Catches it on PR.
        run: bash scripts/check-doc-titles.sh

  # Debug build runs the C++ test binary with assertions active. The `test`
  # job below builds with `-DCMAKE_BUILD_TYPE=Release` (NDEBUG defined), so
  # `assert(x)` is a macro that discards `x` before compilation — any broken
  # expression inside an assertion body (missing method, typo, wrong type)
  # is invisible. A dedicated Debug build catches that class of bug on every
  # push. One matrix entry, ~2 min extra with ccache; cheap insurance.
  # Hosted Ubuntu images stop at GCC 14; the module build needs GCC 15, so
  # both build jobs run in the official gcc image (glibc 2.36 via bookworm).
  debug-build:
    runs-on: ubuntu-latest
    container: gcc:15-bookworm
    needs: dependency-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI deps
        uses: ./.github/actions/setup-ci-deps
        with:
          install-neovim: "true"
          neovim-version: ${{ env.NEOVIM_VERSION }}

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: debug-build

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v4-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: deps-v4-

      - name: Build (Debug)
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DVIMF_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Unit tests (Debug)
        run: |
          ./build/tests/vimfy_unit_tests --gtest_brief=1
          ./build/tests/vimfy_approval_tests --gtest_brief=1

      # Lives here rather than in `test` because this job finishes first.
      - name: Build tracking-enabled exploration target
        run: |
          cmake -G Ninja -B build_track -DCMAKE_BUILD_TYPE=Release -DVIMF_DEBUG=OFF -DVIMF_BUILD_TESTS=ON \
            -DVIMF_TRACK_STATES=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_track --target vimfy_explore -j$(nproc)

  test:
    runs-on: ubuntu-latest
    container: gcc:15-bookworm
    needs: dependency-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI deps
        uses: ./.github/actions/setup-ci-deps
        with:
          install-neovim: "true"
          neovim-version: ${{ env.NEOVIM_VERSION }}

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: test

      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v4-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: deps-v4-

      - name: Build
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DVIMF_DEBUG=OFF -DVIMF_BUILD_TESTS=ON \
            -DVIMF_TRACK_STATES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          # Only what the gate runs; debug-build compiles every target.
          cmake --build build -j$(nproc) --target \
            vimfy_unit_tests vimfy_approval_tests vimfy_property_tests vimfy_safety_tests vimficiency

      # The Lua/FFI suite captures through the CmdAtom event (Neovim 0.13-dev+),
      # which the pinned v0.11.5 lacks. Install a nightly alongside and point
      # only the Lua phase at it via VF_NVIM; the C++ oracle keeps the pinned
      # release. Cache key is date-stamped so a stale nightly can't outlive the
      # day it was fetched.
      - name: Date stamp for nightly cache
        id: nightly-date
        shell: bash
        run: echo "ymd=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Neovim nightly
        id: nvim-nightly-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/neovim/nightly
          key: neovim-nightly-${{ runner.os }}-${{ runner.arch }}-${{ steps.nightly-date.outputs.ymd }}

      - name: Install Neovim nightly
        if: steps.nvim-nightly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64) nvim_arch=arm64 ;;
            *)       nvim_arch=x86_64 ;;
          esac
          archive="${RUNNER_TEMP}/nvim-nightly.tar.gz"
          install_dir="${HOME}/.local/neovim/nightly"
          curl -fsSL -o "${archive}" \
            "https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-${nvim_arch}.tar.gz"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" --strip-components=1

      - name: Fast correctness gate
        # Exercises deterministic C++ unit and approval tests, seeded property and
        # safety tests, and the Lua/FFI boundary through Neovim headless. VF_NVIM
        # routes only the Lua phase at the nightly installed above.
        run: |
          export VF_NVIM="${HOME}/.local/neovim/nightly/bin/nvim"
          scripts/vimfy_tests all "" seed
