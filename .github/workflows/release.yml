name: Release
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'lua/vimficiency/ffi/**'
      - 'scripts/embed-binary.cmake'
      - 'scripts/install.sh'
      - '.github/actions/setup-cmake/**'
      - '.github/actions/setup-ci-deps/**'
      - '.github/workflows/release.yml'
  push:
    tags: ['v*']
  # Manual runs build and smoke-test every platform without publishing.
  workflow_dispatch:

permissions:
  contents: read

env:
  NEOVIM_VERSION: v0.11.5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: gcc:16-trixie
            asset: libvimficiency-linux-x86_64.so
            lib: libvimficiency.so
            tool_asset: vimfy_journal-linux-x86_64
          - os: ubuntu-24.04-arm
            container: gcc:16-trixie
            asset: libvimficiency-linux-aarch64.so
            lib: libvimficiency.so
            tool_asset: vimfy_journal-linux-aarch64
          - os: macos-15
            asset: libvimficiency-macos-arm64.dylib
            lib: libvimficiency.dylib
            tool_asset: vimfy_journal-macos-arm64
    runs-on: ${{ matrix.os }}
    # Linux builds in the official gcc image: hosted Ubuntu stops at GCC 14 and
    # the module build needs 16. The trixie image puts the glibc floor at 2.38.
    container: ${{ matrix.container }}
    # Containers default to `sh` (dash); the build step uses bash arrays.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches CMake version
        # The library reports PROJECT_VERSION, so a tag without a bump would ship mislabeled.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -nE 's/^project\(vimficiency VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version" >&2
            exit 1
          fi

      - name: Setup CI deps (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-ci-deps
        with:
          install-neovim: "true"
          neovim-version: ${{ env.NEOVIM_VERSION }}

      - name: Setup deps (macOS)
        # Apple Clang has no `import std`; Homebrew GCC does.
        if: runner.os == 'macOS'
        run: brew install cmake ninja neovim gcc

      - name: Build library and journal scorer
        run: |
          # The C++ runtime is linked in statically so the prebuilts load on
          # systems whose libstdc++ predates GCC 16.
          flags=(-DCMAKE_BUILD_TYPE=Release -DVIMF_DEBUG=OFF -DVIMF_BUILD_TESTS=OFF
                 -DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++
                 -DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++)
          if [ "$RUNNER_OS" = macOS ]; then
            flags+=(-DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16
                    -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0)
          fi
          cmake -G Ninja -B build "${flags[@]}"
          cmake --build build -j --target vimficiency vimfy_journal

      - name: Load smoke test
        # Loads the built library through the Lua FFI loader, which also
        # checks the embedded Api.def hash against the checkout and opens the
        # protobuf decoder. Script mode (-l), so a Lua error fails the step.
        run: |
          echo 'print("vimficiency " .. require("vimficiency.ffi").version_string())' |
            nvim -u NONE --cmd "set rtp+=." -l -

      - name: Journal scorer smoke test
        # Runs the scorer the way `:Vimfy stats` does, over an empty journal
        # directory: the request is encoded by the library just built.
        run: |
          mkdir smoke-journal
          nvim -u NONE --cmd "set rtp+=." -l - <<'EOF'
          local out = assert(io.open("smoke-request", "wb"))
          out:write(require("vimficiency.ffi.core").encode("vf.journal.SampleRequest", {
            journal_dir = "smoke-journal",
            params = { window_sizes = { 4 } },
            keep_days = 1,
          }))
          out:close()
          EOF
          build/vimfy_journal < smoke-request

      - name: Stage assets
        if: github.event_name != 'pull_request'
        run: |
          cp "build/${{ matrix.lib }}" "${{ matrix.asset }}"
          cp build/vimfy_journal "${{ matrix.tool_asset }}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.tool_asset }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes assets/*
