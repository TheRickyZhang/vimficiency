// Protobuf viability spike: the shapes of VF.Explore.State and
// VF.Explore.ApplyResult from lua/vimficiency/types.lua.
syntax = "proto3";

package vf.spike;

option optimize_for = LITE_RUNTIME;

message Position {
  int32 row = 1;
  int32 col = 2;
}

message Range {
  Position begin_pos = 1;
  Position end_pos = 2;
}

message Phase {
  string kind = 1;
  int32 edit_index = 2;
}

message State {
  Phase phase = 1;
  bool is_completed = 2;
  Position cursor = 3;
  int32 total_edits = 4;
  double cost = 5;
  string seq = 6;
  bool can_undo = 7;
  bool can_redo = 8;
  Range target_range = 9;
}

message Applied {}

message Rejected {
  string reason = 1;
}

message ApplyResult {
  oneof outcome {
    Applied applied = 1;
    Rejected rejected = 2;
  }
}
